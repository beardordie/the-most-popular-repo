<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Most Popular Repo on Github: Ephemeral To-Do List</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-top">
        <h1>The Most Popular Repo on Github</h1>
        <button id="archive-toggle" class="archive-toggle" title="Toggle Archive">📁</button>
      </div>
      <h2>Ephemeral To-Do List</h2>
    </header>
    
    <form id="task-form" class="task-form">
      <input 
        type="text" 
        id="task-input" 
        class="task-input" 
        required 
        autocomplete="off" 
        placeholder="Enter your task..."
      >
      <div class="form-controls">
        <select id="lifespan-select" class="lifespan-select">
          <option value="5">5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60" selected>60 seconds</option>
          <option value="120">2 minutes</option>
          <option value="300">5 minutes</option>
          <option value="600">10 minutes</option>
          <option value="900">15 minutes</option>
        </select>
        <button type="submit" class="submit-btn">
          <span>Add Task</span>
        </button>
      </div>
    </form>
    
    <ul id="task-list" class="task-list"></ul>
    
    <section id="archive-section" class="archive-section hidden">
      <h3 class="archive-heading">📁 Task Archive</h3>
      <ul id="archive-list" class="archive-list"></ul>
    </section>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
